name: Run Autobot WMS (Continuous Loop)

on:
  workflow_dispatch:

jobs:
  run-autobot:
    runs-on: self-hosted

    steps:
      - name: Lấy mã nguồn từ Repository
        uses: actions/checkout@v3

      - name: Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl gspread oauth2client aiohttp playwright selenium
          playwright install chromium

      - name: Chạy script Trick.py (Ngâm vòng lặp)
        run: python Trick.py
