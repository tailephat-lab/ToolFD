name: Run Autobot WMS (Continuous Loop)

on:
  workflow_dispatch: # Bấm nút 'Run workflow' trên GitHub để kích hoạt

jobs:
  run-autobot:
    runs-on: self-hosted # Đã chuyển sang chạy trực tiếp trên máy tính công ty

    steps:
      - name: Lấy mã nguồn từ Repository
        uses: actions/checkout@v3

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl gspread oauth2client aiohttp playwright selenium
          playwright install chromium

      - name: Chạy script Trick.py
        run: python Trick.py
