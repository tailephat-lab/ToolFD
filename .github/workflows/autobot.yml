name: Run Autobot WMS (Continuous Loop)

on:
  workflow_dispatch: # Chỉ chạy khi ný bấm nút 'Run workflow' trên giao diện GitHub

jobs:
  run-autobot:
    # Nếu dùng Self-Hosted Runner (máy cty) thì sửa thành: runs-on: self-hosted
    # Nếu thử nghiệm trên Cloud GitHub thì để: runs-on: ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn từ Repository
        uses: actions/checkout@v3

      - name: Cài đặt Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt các thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl gspread oauth2client aiohttp playwright selenium
          playwright install chromium

      - name: Chạy script Trick.py (Ngâm vòng lặp)
        run: python Trick.py
